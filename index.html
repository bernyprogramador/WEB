<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carta Dark Premium · Entrantes Lokeros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page" id="menuRoot"></main>

    <script>
      const menuData = {
        title: "ENTRANTES LOKEROS",
        subtitle: "1 salsa gratis por entrante · Salsa extra +1€",
        sauces: ["BBQ", "Sweet Chilli", "Mostaza & Miel", "Trufada", "Mayo kimchee"],
        columns: [
          {
            sections: [
              {
                name: "PATATA LOVERS",
                items: [
                  { name: "PATATAS BRAVAS LOKA", price: "6,00€", bullets: ["Patatas caseras con salsa brava secreta"] },
                  { name: "PATATAS CLÁSICAS", price: "5,50€", bullets: ["Patatas caseras crujientes y con sal"] },
                  { name: "PATATAS DE LA ABU", price: "7,00€", bullets: ["Chistorra", "Huevo frito"] }
                ]
              },
              {
                name: "CHICKEN LOVERS",
                items: [
                  { name: "LÁGRIMAS DE POLLO", price: "6,50€", bullets: ["Tiras de pechuga", "Rebozado crujiente", "Jugosas por dentro"] },
                  { name: "ALITAS KRISPI (6 UDS)", price: "6,50€", bullets: ["Rebozado crujiente", "Con salsa"] }
                ]
              }
            ]
          },
          {
            sections: [
              {
                name: "ENTRANTES LOKEROS",
                items: [
                  { name: "MIX CROQUETAS LOKAS (5 UDS)", price: "9,50€", bullets: ["Una de cada: jamón, chuletón, setas, rabo de toro y calamar en su tinta"] },
                  { name: "CROQUETAS LOKAS (UNIDAD)", price: "2,50€", bullets: ["Elige tu sabor y repite sin culpa"] },
                  { name: "FLORES DE ALCACHOFA", price: "10,50€", bullets: ["Alcachofa marcada", "Virutas de jamón", "Sal negra", "Aceite de oliva"] }
                ]
              },
              {
                name: "FRANKFURTS",
                items: [
                  { name: "FRANKFURT CLÁSICO", price: "7,00€", bullets: ["Salchicha de cerdo", "Pan suave", "Cebolla frita", "Mostaza y ketchup"] },
                  { name: "CERVELA GOURMET", price: "7,50€", bullets: ["Salchicha suiza", "Pepinillos", "Mostaza"] }
                ]
              }
            ]
          }
        ],
        footerTop: { label: "TOP 3 ENTRANTES", value: "Bravas Loka · Lágrimas de Pollo · Mix Croquetas Lokas" },
        footerNote: "Consulta alérgenos con nuestro personal"
      };

      function renderItem(item) {
        const bullets = item.bullets.map((bullet) => `<li>${bullet}</li>`).join("");

        return `
          <article class="menu-card">
            <header class="card-header">
              <h3 class="item-name">${item.name}</h3>
              <p class="item-price">${item.price}</p>
            </header>
            <ul class="item-bullets">${bullets}</ul>
            <div class="allergens-box">ALÉRGENOS: ________</div>
          </article>
        `;
      }

      function renderSection(section) {
        const items = section.items.map(renderItem).join("");

        return `
          <section class="menu-section">
            <h2 class="section-title">${section.name}</h2>
            <div class="cards-stack">${items}</div>
          </section>
        `;
      }

      function renderColumn(column) {
        return `<div class="menu-column">${column.sections.map(renderSection).join("")}</div>`;
      }

      function renderMenu(data) {
        const sauces = data.sauces.join(" · ");
        const columns = data.columns.map(renderColumn).join("");

        return `
          <div class="menu-wrap">
            <header class="menu-header">
              <h1 class="menu-title">${data.title}</h1>
              <p class="menu-subtitle">${data.subtitle}</p>
              <p class="menu-sauces">${sauces}</p>
            </header>

            <section class="menu-grid">${columns}</section>

            <footer class="menu-footer">
              <p><span>${data.footerTop.label}:</span> ${data.footerTop.value}</p>
              <p>${data.footerNote}</p>
            </footer>
          </div>
        `;
      }

      document.getElementById("menuRoot").innerHTML = renderMenu(menuData);
    </script>
  </body>
</html>
